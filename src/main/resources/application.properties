spring.application.name=hisaab

server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://localhost:5432/Hisaab
spring.datasource.username=postgres
spring.datasource.password=${DB_PWD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

logging.level.org.springframework.security=DEBUG

# --- Email (Gmail SMTP) ---
# MAIL_USERNAME = your full Gmail address
# MAIL_PASSWORD = a 16-character Google "App password", NOT your Gmail password.
#   Get one at https://myaccount.google.com/apppasswords (needs 2-Step
#   Verification switched on first). Paste it without the spaces Google shows.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME}
spring.mail.password=${GMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Where the reset link in the email should point (your React dev server).
# Change this to your deployed URL when you deploy.
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration
logging.level.org.flywaydb=DEBUG